<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Majori Fit — Canon</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1440px;height:900px;overflow:hidden;background:#111;color:#fff;font-family:Inter,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;padding:22px 56px}

  .photo{height:420px;background:#1A1A1A;border-radius:16px}
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;padding:40px 56px}
  .cards div{background:#1A1A1A;border-radius:14px;padding:22px}

</head>
<body>
<header>
  <img src="../../../assets/logo.png" alt="Majori Fit">
  <div><a href="#horarios">Horarios</a><a href="#onde">Onde</a><a href="https://wa.me/556195068117">WhatsApp</a></div>
</header>
<div class="hero">
  <div>
    <h1>Treine na <span>Majori Fit</span> Samambaia</h1>

    <a class="btn" href="https://wa.me/556195068117">Fale no WhatsApp</a>
  </div>
  <div class="photo"></div>
</div>
<div class="cards">
  <div><b>5h</b><p>Abre cedo, fecha as 23h</p></div>
  <div><b>QS 429</b><p>Samambaia Norte, lote 03</p></div>
  <div><b>(61) 9506-8117</b><p>Matricula pelo WhatsApp</p></div>
</div>
</body>
</html>
